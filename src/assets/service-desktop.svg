<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img">
  <!-- Desktop and PC assembly illustration -->
  <defs>
    <linearGradient id="pc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#122a4d"/>
    </linearGradient>
    <radialGradient id="pc-glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pc-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="800" height="560" rx="24" fill="url(#pc-bg)"/>
  <rect width="800" height="560" rx="24" fill="url(#pc-grid)"/>
  <circle cx="400" cy="280" r="240" fill="url(#pc-glow)"/>

  <!-- Monitor -->
  <g transform="translate(140 100)">
    <rect x="0" y="0" width="320" height="210" rx="16" fill="none" stroke="#93c5fd" stroke-width="9"/>
    <rect x="26" y="26" width="268" height="158" rx="6" fill="#3b82f6" opacity="0.22"/>
    <path d="M160 210v46M96 256h128" stroke="#93c5fd" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Tower / CPU cabinet -->
  <g transform="translate(520 90)">
    <rect x="0" y="0" width="150" height="300" rx="14" fill="none" stroke="#93c5fd" stroke-width="9"/>
    <rect x="26" y="30" width="98" height="70" rx="8" fill="#3b82f6" opacity="0.3"/>
    <path d="M26 132h98M26 156h98" stroke="#60a5fa" stroke-width="7" stroke-linecap="round"/>
    <circle cx="75" cy="230" r="18" fill="none" stroke="#3b82f6" stroke-width="7"/>
    <circle cx="75" cy="230" r="5" fill="#93c5fd"/>
    <line x1="75" y1="196" x2="75" y2="212" stroke="#60a5fa" stroke-width="5"/>
  </g>

  <!-- Keyboard hint -->
  <g transform="translate(170 420)">
    <rect x="0" y="0" width="260" height="56" rx="12" fill="none" stroke="#93c5fd" stroke-width="7"/>
    <g fill="#60a5fa" opacity="0.7">
      <rect x="20" y="16" width="26" height="9" rx="3"/><rect x="54" y="16" width="26" height="9" rx="3"/><rect x="88" y="16" width="26" height="9" rx="3"/><rect x="122" y="16" width="26" height="9" rx="3"/><rect x="156" y="16" width="26" height="9" rx="3"/><rect x="190" y="16" width="50" height="9" rx="3"/>
    </g>
  </g>
</svg>
