<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img">
  <!-- Networking and Wi-Fi illustration -->
  <defs>
    <linearGradient id="net-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#122a4d"/>
    </linearGradient>
    <radialGradient id="net-glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="net-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="800" height="560" rx="24" fill="url(#net-bg)"/>
  <rect width="800" height="560" rx="24" fill="url(#net-grid)"/>
  <circle cx="400" cy="280" r="240" fill="url(#net-glow)"/>

  <!-- Router -->
  <g transform="translate(250 300)">
    <rect x="0" y="40" width="300" height="90" rx="18" fill="none" stroke="#93c5fd" stroke-width="9"/>
    <circle cx="52" cy="85" r="10" fill="#3b82f6"/>
    <circle cx="92" cy="85" r="10" fill="#60a5fa"/>
    <rect x="210" y="72" width="56" height="14" rx="7" fill="#3b82f6" opacity="0.6"/>
    <line x1="70" y1="-20" x2="70" y2="40" stroke="#93c5fd" stroke-width="8" stroke-linecap="round"/>
    <line x1="230" y1="-20" x2="230" y2="40" stroke="#93c5fd" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Wi-Fi waves -->
  <g fill="none" stroke="#3b82f6" stroke-linecap="round">
    <path d="M330 236a120 120 0 0 1 140 0" stroke-width="9" opacity="0.9"/>
    <path d="M358 196a80 80 0 0 1 84 0" stroke-width="9" opacity="0.65"/>
    <circle cx="400" cy="262" r="12" fill="#93c5fd" stroke="none"/>
  </g>

  <!-- Connected devices -->
  <g stroke="#3b82f6" stroke-width="6" fill="none" opacity="0.8">
    <path d="M280 390v50h-110v40"/>
    <path d="M520 390v50h110v40"/>
    <path d="M400 430v70"/>
  </g>
  <g fill="none" stroke="#93c5fd" stroke-width="7">
    <rect x="130" y="480" width="80" height="54" rx="10"/>
    <rect x="360" y="500" width="80" height="34" rx="8"/>
    <rect x="590" y="480" width="80" height="54" rx="10"/>
  </g>
</svg>
