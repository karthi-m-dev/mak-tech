<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img">
  <!-- Mak Tech computer service shop illustration -->
  <defs>
    <linearGradient id="shop-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#10233f"/>
    </linearGradient>
    <radialGradient id="shop-glow" cx="0.5" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="shop-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="800" height="600" rx="24" fill="url(#shop-bg)"/>
  <rect width="800" height="600" rx="24" fill="url(#shop-grid)"/>
  <circle cx="400" cy="280" r="270" fill="url(#shop-glow)"/>

  <!-- Work bench -->
  <rect x="90" y="440" width="620" height="22" rx="10" fill="#234a7c"/>
  <rect x="130" y="462" width="18" height="110" rx="6" fill="#1e3a5f"/>
  <rect x="652" y="462" width="18" height="110" rx="6" fill="#1e3a5f"/>

  <!-- Laptop on bench -->
  <g transform="translate(150 300)">
    <rect x="30" y="0" width="200" height="126" rx="12" fill="none" stroke="#93c5fd" stroke-width="7"/>
    <rect x="50" y="18" width="160" height="90" rx="5" fill="#3b82f6" opacity="0.25"/>
    <path d="M8 138h244l22 32H-14z" fill="none" stroke="#93c5fd" stroke-width="7" stroke-linejoin="round"/>
  </g>

  <!-- Desktop tower being serviced -->
  <g transform="translate(450 220)">
    <rect x="0" y="0" width="130" height="220" rx="12" fill="none" stroke="#93c5fd" stroke-width="7"/>
    <rect x="22" y="22" width="86" height="56" rx="6" fill="#3b82f6" opacity="0.3"/>
    <path d="M22 100h86M22 122h86" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/>
    <circle cx="65" cy="168" r="14" fill="none" stroke="#3b82f6" stroke-width="6"/>
  </g>

  <!-- Shelf with parts boxes -->
  <g transform="translate(620 90)">
    <line x1="0" y1="70" x2="150" y2="70" stroke="#234a7c" stroke-width="10"/>
    <rect x="12" y="18" width="52" height="52" rx="6" fill="none" stroke="#60a5fa" stroke-width="6"/>
    <rect x="84" y="18" width="52" height="52" rx="6" fill="#3b82f6" opacity="0.35"/>
  </g>

  <!-- Hanging sign -->
  <g transform="translate(180 70)">
    <line x1="60" y1="0" x2="60" y2="26" stroke="#234a7c" stroke-width="6"/>
    <rect x="0" y="26" width="120" height="54" rx="12" fill="none" stroke="#93c5fd" stroke-width="6"/>
    <path d="M28 53h64" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Tools on bench -->
  <g stroke-linecap="round">
    <line x1="330" y1="418" x2="400" y2="418" stroke="#60a5fa" stroke-width="9"/>
    <rect x="398" y="407" width="26" height="22" rx="8" fill="#3b82f6"/>
    <line x1="470" y1="420" x2="520" y2="420" stroke="#93c5fd" stroke-width="9"/>
    <circle cx="536" cy="420" r="13" fill="none" stroke="#3b82f6" stroke-width="7"/>
  </g>
</svg>
