<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img">
  <!-- Computer accessories illustration -->
  <defs>
    <linearGradient id="acc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#122a4d"/>
    </linearGradient>
    <radialGradient id="acc-glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="acc-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="800" height="560" rx="24" fill="url(#acc-bg)"/>
  <rect width="800" height="560" rx="24" fill="url(#acc-grid)"/>
  <circle cx="400" cy="280" r="240" fill="url(#acc-glow)"/>

  <!-- Keyboard -->
  <g transform="translate(120 320)">
    <rect x="0" y="0" width="340" height="120" rx="16" fill="none" stroke="#93c5fd" stroke-width="8"/>
    <g fill="#60a5fa" opacity="0.75">
      <rect x="24" y="22" width="38" height="16" rx="4"/><rect x="74" y="22" width="38" height="16" rx="4"/><rect x="124" y="22" width="38" height="16" rx="4"/><rect x="174" y="22" width="38" height="16" rx="4"/><rect x="224" y="22" width="38" height="16" rx="4"/><rect x="274" y="22" width="42" height="16" rx="4"/>
      <rect x="24" y="52" width="64" height="16" rx="4"/><rect x="100" y="52" width="140" height="16" rx="4"/><rect x="252" y="52" width="64" height="16" rx="4"/>
      <rect x="100" y="82" width="140" height="16" rx="4"/>
    </g>
  </g>

  <!-- Mouse -->
  <g transform="translate(540 300)">
    <rect x="0" y="0" width="120" height="180" rx="58" fill="none" stroke="#93c5fd" stroke-width="8"/>
    <line x1="60" y1="10" x2="60" y2="66" stroke="#93c5fd" stroke-width="7"/>
    <line x1="0" y1="66" x2="120" y2="66" stroke="#93c5fd" stroke-width="7"/>
    <rect x="46" y="30" width="28" height="12" rx="6" fill="#3b82f6"/>
  </g>

  <!-- USB drive + cable -->
  <g transform="translate(160 150)">
    <rect x="0" y="20" width="150" height="70" rx="14" fill="none" stroke="#93c5fd" stroke-width="8"/>
    <rect x="150" y="38" width="44" height="34" rx="4" fill="#3b82f6" opacity="0.6"/>
    <rect x="24" y="42" width="60" height="12" rx="6" fill="#60a5fa"/>
    <path d="M194 55h90a40 40 0 0 1 0 80h-40a30 30 0 0 0 0 60h60" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Headphones hint -->
  <g transform="translate(600 130)" fill="none" stroke="#93c5fd" stroke-width="8" stroke-linecap="round">
    <path d="M20 90a70 70 0 0 1 140 0"/>
    <rect x="8" y="86" width="36" height="60" rx="14" fill="#3b82f6" opacity="0.4"/>
    <rect x="136" y="86" width="36" height="60" rx="14" fill="#3b82f6" opacity="0.4"/>
  </g>
</svg>
