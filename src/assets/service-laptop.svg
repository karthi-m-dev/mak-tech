<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img">
  <!-- Laptop sales and service illustration -->
  <defs>
    <linearGradient id="lap-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#122a4d"/>
    </linearGradient>
    <radialGradient id="lap-glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lap-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="800" height="560" rx="24" fill="url(#lap-bg)"/>
  <rect width="800" height="560" rx="24" fill="url(#lap-grid)"/>
  <circle cx="400" cy="280" r="240" fill="url(#lap-glow)"/>

  <!-- Laptop -->
  <g transform="translate(210 120)">
    <rect x="50" y="0" width="280" height="180" rx="16" fill="none" stroke="#93c5fd" stroke-width="9"/>
    <rect x="76" y="26" width="228" height="128" rx="6" fill="#3b82f6" opacity="0.25"/>
    <path d="M150 70h80M150 100h120" stroke="#60a5fa" stroke-width="8" stroke-linecap="round"/>
    <path d="M20 196h340l30 48H-10z" fill="none" stroke="#93c5fd" stroke-width="9" stroke-linejoin="round"/>
    <path d="M150 214h80" stroke="#60a5fa" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Spark accents -->
  <g stroke="#3b82f6" stroke-width="7" stroke-linecap="round">
    <path d="M640 140v34M623 157h34"/>
    <path d="M150 420v28M136 434h28"/>
  </g>
</svg>
